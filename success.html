<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signed in</title>
<style>
  :root { --ink:#14110f; --muted:#6c6762; --ok:#1a8f4d; --accent-2:#5a22d6; }
  * { box-sizing: border-box; }
  body { margin:0; font:17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif;
         color:var(--ink); background:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .card { max-width:420px; }
  .tick { width:84px; height:84px; border-radius:50%; background:var(--ok); color:#fff; font-size:46px; line-height:84px; margin:0 auto 22px; }
  h1 { margin:0 0 8px; font-size:26px; }
  p { margin:0 0 26px; color:var(--muted); }
  a.btn { display:block; border-radius:14px; padding:16px; font-size:18px; font-weight:600; color:#fff; background:var(--accent-2); text-decoration:none; }
</style>
</head>
<body>
<div class="card">
  <div class="tick">✓</div>
  <h1>You're signed in</h1>
  <p>You can go back to Messages now.</p>
  <a class="btn" id="back" href="sms:">Return to Messages</a>
</div>
</body>
</html>
